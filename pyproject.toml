[project]
name = "customer-intelligence-studio"
version = "1.0.0"
description = "Interactive customer and mobility analytics with AI-assisted decision support"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "data", ".streamlit"]

[tool.ruff.lint]
# Default rules (pyflakes + a pycodestyle subset) plus bugbear and comprehensions.
select = ["E4", "E7", "E9", "F", "B", "C4", "UP"]
ignore = [
    "B008",  # Streamlit widget defaults are evaluated at call time by design.
]

[tool.ruff.lint.per-file-ignores]
# Streamlit pages are scripts: they execute top to bottom rather than defining functions.
"pages/*.py" = ["E402"]
"app.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*No runtime found.*:UserWarning",
]
